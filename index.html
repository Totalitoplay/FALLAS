<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R3 Scripts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Buscador de Cuentas e Inventario QR</h2>
    
    <div class="config">
        <label>1. Cargar Base de Datos (CSV):</label>
        <input type="file" id="csvFile" accept=".csv">
    </div>

<div class="input-section">
    <label>2. Cargar Listado de Clientes:</label>
    <div style="display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 200px;">
            <small>Opción A: Subir CSV de clientes</small>
            <input type="file" id="clientCsvFile" accept=".csv" style="margin-top:5px;">
        </div>
        <div style="flex: 1; min-width: 200px;">
            <small>Opción B: Pegar reporte</small>
            <textarea id="reportInput" placeholder="Pega aquí el reporte..."></textarea>
        </div>
    </div>
    <button onclick="procesarBusqueda()" id="btnBuscar">🔍 Localizar QRs</button>
</div>

<table id="resultTable">
    <thead>
        <tr>
            <th onclick="ordenarTabla(0)" style="cursor:pointer">Cuenta ↕️</th>
            <th onclick="ordenarTabla(1)" style="cursor:pointer">QR ↕️</th>
            <th>Coordenadas</th>
            <th>Mapa</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

    <script src="app.js?v=99"></script>
</body>
</html>
